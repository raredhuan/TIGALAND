      --tl-purple: #6B58A5; --tl-orange: #F2A45A; --tl-teal: #62B9A5;
      --tl-yellow: #F5D56B; --tl-pink: #F3A5AD; --tl-cream: #FFF5E6;
      --tl-navy: #36415D; --tl-green: #B9D98C;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--tl-cream);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--tl-navy); overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--tl-navy); color: #FFF;
      padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 700;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 50; pointer-events: none;
    }
    #toast.visible { transform: translateX(-50%) translateY(0); }
  </style>

    class DeviceSaveManager {
      constructor(gameId) {
        this.key = `TIGALAND_SAVE_${gameId}_V2`;
        this.data = this.load();
      }
      defaultData() {
        return {
          gameId: GAME_DATA.gameId, totalXP: 0, totalCoins: 0, unlockedLevelIndex: 0,
          levels: {
            L1: { bestScore: 0, stars: 0 }, L2: { bestScore: 0, stars: 0 },
            L3: { bestScore: 0, stars: 0 }, L4: { bestScore: 0, stars: 0 },
            L5: { bestScore: 0, stars: 0 }
          }
        };
      }
      load() {
        try {
          const raw = localStorage.getItem(this.key);
          return raw ? Object.assign(this.defaultData(), JSON.parse(raw)) : this.defaultData();
        } catch (e) { return this.defaultData(); }
      }
      save() {
        try { localStorage.setItem(this.key, JSON.stringify(this.data)); return true; } catch (e) { return false; }
      }
      record(levelIdx, code, score, maxScore) {
        const ratio = score / maxScore;
        const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
        const lvl = this.data.levels[code];
        if (score > lvl.bestScore) lvl.bestScore = score;
        if (stars > lvl.stars) lvl.stars = stars;
        const xp = score * 2, coins = Math.floor(score / 10);
        this.data.totalXP += xp; this.data.totalCoins += coins;
        let unlockedNext = false;
        if (ratio >= 0.7 && levelIdx + 1 > this.data.unlockedLevelIndex && levelIdx + 1 < 5) {
          this.data.unlockedLevelIndex = levelIdx + 1;
          unlockedNext = true;
        }
        this.save();
        return { stars, xp, coins, unlockedNext };
      }
    }

    class AudioManager {
      constructor() { this.muted = false; this.ctx = null; }
      tone(f, d = 0.16, delay = 0, type = "sine") {
        if (this.muted) return;
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (!this.ctx) return;
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
        const t = this.ctx.currentTime + delay;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(t); o.stop(t + d + 0.02);
      }
      ok() { this.tone(523.25, 0.14, 0); this.tone(659.25, 0.14, 0.09); this.tone(783.99, 0.24, 0.18); }
      retry() { this.tone(392, 0.14, 0, "triangle"); this.tone(349.23, 0.2, 0.11, "triangle"); }
      tap() { this.tone(560, 0.08, 0, "triangle"); }
    }

    class WordBuilderEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext("2d");
        this.saveMgr = new DeviceSaveManager(GAME_DATA.gameId);
        this.audio = new AudioManager();

        this.state = "LEVEL_SELECT";
        this.levelIdx = 0;
        this.questions = [];
        this.qIdx = 0;
        this.score = 0;
        this.builtSlots = [];
        this.shuffledPool = [];
        this.usedPoolIndices = new Set();
        this.buttons = [];
        this.particles = [];
        this.feedback = { text: "", color: BRAND.tealDark, timer: 0 };
        this.lastTime = 0;

        window.addEventListener("resize", () => this.resize());
        this.canvas.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const r = this.canvas.getBoundingClientRect();
          const x = e.clientX - r.left, y = e.clientY - r.top;
          for (let i = this.buttons.length - 1; i >= 0; i--) {
            const b = this.buttons[i];
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h && !b.disabled) {
              b.onClick(); break;
            }
          }
        });
        this.resize();
      }

      resize() {
        this.w = window.innerWidth; this.h = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = this.w * dpr; this.canvas.height = this.h * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg; el.classList.add("visible");
        clearTimeout(this._tt);
        this._tt = setTimeout(() => el.classList.remove("visible"), 2800);
      }

      startLevel(idx) {
        this.audio.tap();
        this.levelIdx = idx;
        this.questions = [...GAME_DATA.levels[idx].questions].sort(() => Math.random() - 0.5);
        this.qIdx = 0;
        this.score = 0;
        this.setupQuestion();
        this.state = "PLAYING";
      }

      setupQuestion() {
        const q = this.questions[this.qIdx];
        if (!q) return;
        this.builtSlots = [];
        this.usedPoolIndices.clear();
        this.shuffledPool = [...q.pool].sort(() => Math.random() - 0.5);
        this.feedback.text = "";
      }

      pickSyllable(poolIdx, syl) {
        if (this.state !== "PLAYING" || this.usedPoolIndices.has(poolIdx)) return;
        const q = this.questions[this.qIdx];
        this.audio.tap();
        this.usedPoolIndices.add(poolIdx);
        this.builtSlots.push(syl);

        if (this.builtSlots.length === q.syllables.length) {
          const formed = this.builtSlots.join("");
          if (formed === q.word) {
            this.audio.ok();
            this.score += 10;
            this.feedback = { text: `Hebat! Perkataan terbina: ${q.word} (+10)`, color: BRAND.tealDark, timer: 1.15 };
            this.spawnConfetti(this.w / 2, this.h * 0.45);
            this.state = "WAIT_NEXT";
          } else {
            this.audio.retry();
            this.feedback = { text: `Cuba susun semula suku kata bagi ${q.icon}!`, color: BRAND.orangeDark, timer: 1.1 };
            setTimeout(() => {
              if (this.state === "PLAYING") {
                this.builtSlots = [];
                this.usedPoolIndices.clear();
              }
            }, 650);
          }
        }
      }

      clearSlots() {
        if (this.state !== "PLAYING") return;
        this.audio.tap();
        this.builtSlots = [];
        this.usedPoolIndices.clear();
      }

      spawnConfetti(cx, cy) {
        const cols = [BRAND.purple, BRAND.orange, BRAND.teal, BRAND.yellow, BRAND.pink, BRAND.green];
        for (let i = 0; i < 28; i++) {
          const a = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 210;
          this.particles.push({
            x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 110,
            color: cols[i % cols.length], life: 1.0, size: 8
          });
        }
      }

      update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt; p.life -= dt;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        if (this.feedback.timer > 0) {
          this.feedback.timer -= dt;
          if (this.feedback.timer <= 0 && this.state === "WAIT_NEXT") {
            this.qIdx++;
            if (this.qIdx < this.questions.length) {
              this.setupQuestion();
              this.state = "PLAYING";
            } else {
              const lvl = GAME_DATA.levels[this.levelIdx];
              this.reward = this.saveMgr.record(this.levelIdx, lvl.code, this.score, lvl.questions.length * 10);
              this.state = "SUMMARY";
              this.toast("Auto-Simpan berjaya!");
            }
          }
        }
      }

      roundRect(x, y, w, h, r, fill, stroke = null, lw = 3) {
        const ctx = this.ctx, rad = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
      }

      drawHUD(inGame) {
        const ctx = this.ctx, pad = 14;
        if (inGame) {
          this.roundRect(pad, pad, 120, 46, 23, BRAND.purple, "#FFF", 2.5);
          ctx.fillStyle = "#FFF"; ctx.font = '800 15px "Trebuchet MS", sans-serif';
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("◀ TAHAP", pad + 60, pad + 24);
          this.buttons.push({ x: pad, y: pad, w: 120, h: 46, onClick: () => { this.audio.tap(); this.state = "LEVEL_SELECT"; } });
        } else {
          this.roundRect(pad, pad, 150, 46, 23, BRAND.purple, "#FFF", 2.5);
          ctx.fillStyle = "#FFF"; ctx.font = '900 16px "Trebuchet MS", sans-serif';
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("TIGA LAND", pad + 75, pad + 24);
        }

        const sX = this.w - pad - 46;
        this.roundRect(sX, pad, 46, 46, 23, this.audio.muted ? BRAND.pink : BRAND.teal, "#FFF", 2.5);
        ctx.fillStyle = "#FFF"; ctx.font = '800 18px "Trebuchet MS", sans-serif';
        ctx.textAlign = "center";
        ctx.fillText(this.audio.muted ? "🔇" : "🔊", sX + 23, pad + 24);
        this.buttons.push({ x: sX, y: pad, w: 46, h: 46, onClick: () => { this.audio.muted = !this.audio.muted; } });

        if (inGame) {
          this.roundRect(sX - 115, pad, 105, 46, 23, BRAND.yellow, "#FFF", 2.5);
          ctx.fillStyle = BRAND.navy; ctx.font = '900 17px "Trebuchet MS", sans-serif';
          ctx.fillText(`⭐ ${this.score}`, sX - 62, pad + 24);
        }
      }

      render() {
        this.buttons = [];
        const ctx = this.ctx, cx = this.w / 2;
        ctx.clearRect(0, 0, this.w, this.h);

        if (this.state === "LEVEL_SELECT") {
          this.drawHUD(false);
          ctx.fillStyle = BRAND.purple; ctx.font = '900 28px "Trebuchet MS", sans-serif';
          ctx.textAlign = "center"; ctx.fillText("BM003: Suku Kata KV", cx, 92);
          ctx.fillStyle = "#5C6885"; ctx.font = '700 14px "Trebuchet MS", sans-serif';
          ctx.fillText("Sentuh suku kata mengikut urutan gambar • Auto-Simpan Aktif ✓", cx, 118);

          const cardW = Math.min(580, this.w * 0.92), cardH = Math.min(76, (this.h - 170) / 5);
          const startX = cx - cardW / 2;
          GAME_DATA.levels.forEach((lvl, idx) => {
            const y = 140 + idx * (cardH + 10);
            const unlocked = idx <= this.saveMgr.data.unlockedLevelIndex;
            const saved = this.saveMgr.data.levels[lvl.code];
            this.roundRect(startX, y + 4, cardW, cardH, 20, unlocked ? lvl.shadow : "#BDC3CF");
            this.roundRect(startX, y, cardW, cardH, 20, unlocked ? "#FFF" : "#ECEEF2", unlocked ? lvl.color : "#C8CEDB", 3);

            this.roundRect(startX + 12, y + 10, 60, cardH - 20, 14, unlocked ? lvl.color : "#AEB5C2");
            ctx.fillStyle = "#FFF"; ctx.font = '900 19px "Trebuchet MS", sans-serif';
            ctx.textAlign = "center"; ctx.fillText(lvl.code, startX + 42, y + cardH / 2 + 1);

            ctx.textAlign = "left"; ctx.fillStyle = unlocked ? BRAND.navy : "#7D8597";
            ctx.font = '800 17px "Trebuchet MS", sans-serif';
            ctx.fillText(lvl.label, startX + 84, y + cardH * 0.38);
            ctx.fillStyle = "#5C6885"; ctx.font = '600 13px "Trebuchet MS", sans-serif';
            ctx.fillText(unlocked ? lvl.desc : "Tamatkan tahap sebelum (≥70%)", startX + 84, y + cardH * 0.72);

            ctx.textAlign = "right";
            if (unlocked) {
              ctx.font = '800 16px "Trebuchet MS", sans-serif';
              ctx.fillText("⭐".repeat(saved.stars) + "☆".repeat(3 - saved.stars), startX + cardW - 16, y + cardH * 0.42);
              ctx.fillStyle = lvl.shadow; ctx.font = '800 13px "Trebuchet MS", sans-serif';
              ctx.fillText(saved.bestScore > 0 ? `Terbaik: ${saved.bestScore}` : "MULA ▶", startX + cardW - 16, y + cardH * 0.74);
              this.buttons.push({ x: startX, y, w: cardW, h: cardH, onClick: () => this.startLevel(idx) });
            } else {
              ctx.font = '800 22px "Trebuchet MS", sans-serif';
              ctx.fillText("🔒", startX + cardW - 20, y + cardH / 2 + 2);
            }
          });
        } else if (this.state === "PLAYING" || this.state === "WAIT_NEXT") {
          this.drawHUD(true);
          const q = this.questions[this.qIdx];
          if (!q) return;

          // Picture Stimulus Card
          const picW = Math.min(340, this.w * 0.86), picH = 126;
          this.roundRect(cx - picW / 2, 76, picW, picH, 24, "#FFFFFF", BRAND.purple, 3.5);
          ctx.font = '72px "Trebuchet MS", sans-serif';
          ctx.textAlign = "center";
          ctx.fillText(q.icon, cx, 142);

          // Answer Construction Slots
          const slotCount = q.syllables.length;
          const slotW = Math.min(125, (this.w * 0.85) / slotCount), slotH = 68, slotGap = 14;
          const slotStartX = cx - (slotW * slotCount + slotGap * (slotCount - 1)) / 2;
          const slotY = 222;

          for (let i = 0; i < slotCount; i++) {
            const sx = slotStartX + i * (slotW + slotGap);
            const filled = this.builtSlots[i];
            this.roundRect(sx, slotY, slotW, slotH, 18, filled ? BRAND.yellow : "#FFFFFF", filled ? BRAND.orangeDark : BRAND.teal, 3.5);
            ctx.fillStyle = BRAND.navy;
            ctx.font = '900 30px "Trebuchet MS", sans-serif';
            ctx.fillText(filled || "?", sx + slotW / 2, slotY + slotH / 2 + 2);
          }

          // Clear/Reset Slots Pill Button
          if (this.builtSlots.length > 0 && this.state === "PLAYING") {
            const clrW = 130, clrH = 36;
            this.roundRect(cx - clrW / 2, slotY + slotH + 10, clrW, clrH, 18, BRAND.pink, "#FFF", 2);
            ctx.fillStyle = "#FFF"; ctx.font = '800 13px "Trebuchet MS", sans-serif';
            ctx.fillText("PADAM ⌫", cx, slotY + slotH + 29);
            this.buttons.push({ x: cx - clrW / 2, y: slotY + slotH + 10, w: clrW, h: clrH, onClick: () => this.clearSlots() });
          }

          // Syllable Tile Choices
          const poolCount = this.shuffledPool.length;
          const tileGap = 12;
          const tileW = Math.min(115, (this.w * 0.92 - tileGap * (poolCount - 1)) / poolCount);
          const tileH = 88;
          const tileStartX = cx - (tileW * poolCount + tileGap * (poolCount - 1)) / 2;
          const tileY = Math.max(350, this.h - tileH - 85);

          this.shuffledPool.forEach((syl, idx) => {
            const tx = tileStartX + idx * (tileW + tileGap);
            const used = this.usedPoolIndices.has(idx);
            this.roundRect(tx, tileY + 5, tileW, tileH, 20, used ? "#D0D5DF" : BRAND.tealDark);
            this.roundRect(tx, tileY, tileW, tileH, 20, used ? "#E8ECF2" : "#FFFFFF", used ? "#B8C0CE" : BRAND.teal, 3.5);
            ctx.fillStyle = used ? "#9AA3B2" : BRAND.navy;
            ctx.font = `900 ${Math.min(32, tileW * 0.36)}px "Trebuchet MS", sans-serif`;
            ctx.fillText(syl, tx + tileW / 2, tileY + tileH / 2 + 2);

            this.buttons.push({
              x: tx, y: tileY, w: tileW, h: tileH,
              disabled: used || this.state !== "PLAYING",
              onClick: () => this.pickSyllable(idx, syl)
            });
          });

          if (this.feedback.text) {
            const fbW = Math.min(540, this.w * 0.92);
            this.roundRect(cx - fbW / 2, this.h - 62, fbW, 48, 24, this.feedback.color, "#FFF", 2);
            ctx.fillStyle = "#FFF"; ctx.font = '800 16px "Trebuchet MS", sans-serif';
            ctx.fillText(this.feedback.text, cx, this.h - 38);
          }
        } else if (this.state === "SUMMARY") {
          this.drawHUD(true);
          const cardW = Math.min(500, this.w * 0.9), cardH = 380;
          const cardX = cx - cardW / 2, cardY = this.h / 2 - cardH / 2 + 15;
          this.roundRect(cardX, cardY, cardW, cardH, 30, "#FFF", BRAND.teal, 4.5);

          ctx.fillStyle = BRAND.tealDark; ctx.font = '900 30px "Trebuchet MS", sans-serif';
          ctx.textAlign = "center"; ctx.fillText("Tahniah! Selesai!", cx, cardY + 58);

          const r = this.reward || { stars: 0, xp: 0, coins: 0 };
          ctx.font = '800 32px "Trebuchet MS", sans-serif';
          ctx.fillText("⭐".repeat(r.stars) + "☆".repeat(3 - r.stars), cx, cardY + 106);

          ctx.fillStyle = BRAND.purple; ctx.font = '900 28px "Trebuchet MS", sans-serif';
          ctx.fillText(`Skor: ${this.score} / 100`, cx, cardY + 158);

          ctx.fillStyle = BRAND.navy; ctx.font = '700 14px "Trebuchet MS", sans-serif';
          ctx.fillText(`+${r.xp} XP • +${r.coins} Syiling • Auto-Simpan ✓`, cx, cardY + 192);

          const btnW = 260;
          this.roundRect(cx - btnW / 2, cardY + 230, btnW, 54, 20, BRAND.orange, "#FFF", 2);
          ctx.fillStyle = "#FFF"; ctx.font = '800 19px "Trebuchet MS", sans-serif';
          ctx.fillText("MAIN SEMULA ↻", cx, cardY + 258);
          this.buttons.push({ x: cx - btnW / 2, y: cardY + 230, w: btnW, h: 54, onClick: () => this.startLevel(this.levelIdx) });

          this.roundRect(cx - btnW / 2, cardY + 298, btnW, 50, 20, BRAND.purple, "#FFF", 2);
          ctx.fillStyle = "#FFF"; ctx.font = '800 17px "Trebuchet MS", sans-serif';
          ctx.fillText("PILIH TAHAP LAIN", cx, cardY + 324);
          this.buttons.push({ x: cx - btnW / 2, y: cardY + 298, w: btnW, h: 50, onClick: () => { this.state = "LEVEL_SELECT"; } });
        }

        this.particles.forEach((p) => {
          ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
        });
      }

      start() {
        const loop = (now) => {
          const dt = Math.min((now - this.lastTime) / 1000, 0.1);
          this.lastTime = now;
          this.update(dt);
          this.render();
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    }

    window.addEventListener("load", () => new WordBuilderEngine("tiga-canvas").start());
  </script>
</body>
</html>
